method: ours
# Reward r(x_0), evaluated on *clean* x_0 samples (no noisy classifier needed).
reward: qed  # qed / ring_count
# Tilting strength: q(x_0) \propto p_theta(x_0) exp(lambda * r(x_0)).
# lambda_ = 0 recovers unguided sampling (uniform weights).
lambda_: 10.0
# N in Eq. (4): number of x_0 candidates drawn per denoising step.
num_x0_samples: 30
# Apply guidance only while t_min <= t <= t_max; sampling is unguided outside
# the window (identical to the base sampler, and it skips the reward calls).
# t runs from 1 (pure noise) down to ~0 (clean), so t_max < 1 disables guidance
# for the early, high-noise steps where the x_0 candidates are mostly garbage.
t_min: 0.0
t_max: 1.0
# How to draw x_{t-1} from the mixture in Eq. (8).
#   exact:        n* ~ Cat(w), then x_{t-1} ~ q(x_{t-1} | x_t, x_0^(n*)).
#                 Samples the mixture of Eq. (8) without approximation.
#   marginal:     average the N *normalized* posteriors, sample positions
#                 independently. Keeps the mixture's per-position marginals,
#                 drops correlations across positions.
#   aggregate_x0: substitute the weighted histogram xbar_0 of the N candidates
#                 for x_0 in the posterior, normalize once. This is the form
#                 discriminator guidance uses; equals `marginal` for
#                 absorbing-state diffusion.
mixture_sampling: aggregate_x0
# Reward given to x_0 candidates that RDKit cannot parse.
invalid_reward: 0.0
# `aggregate_x0` only: mix the denoiser marginal x_theta back into the candidate
# histogram with this weight. The histogram is an atomic measure over the N
# candidates, so tokens none of them proposed at a position get exactly zero
# probability -- an implicit truncation of x_theta's ~1/N tail. A small floor
# restores full support. 0 disables it.
support_floor: 0.0
# z-score the N rewards within each step before applying lambda_.
normalize_reward: False
# Process-pool size for the RDKit reward calls (<=1 runs them inline). RDKit
# costs ~1.3 ms per molecule, which is the sampler's bottleneck at large N.
num_reward_workers: 32
# `condition` is unused by this method; kept so that the shared eval
# scripts (which log every guidance field) work unchanged.
condition: -1
